[project]
name = "campanha-ac"
version = "0.1.0"
description = "Dashboard analítico e gestão de campanha eleitoral — Acre"
requires-python = ">=3.11"
dependencies = [
    # ETL
    "pandas>=2.2",
    "pyarrow>=16",
    "requests>=2.32",
    "tqdm>=4.66",
    "unidecode>=1.3",
    # DB
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    # Dashboard
    "streamlit>=1.39",
    "folium>=0.18",
    "streamlit-folium>=0.23",
    "plotly>=5.24",
    "geopandas>=1.0",
    # Comum
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["api", "api.routes", "etl", "dashboard", "dashboard.components"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
